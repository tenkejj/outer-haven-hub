<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OUTER HAVEN · PANEL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="panel.css?v=panel1">
</head>
<body>
  <!--
    Panel instrumentowy — układ w STAŁYCH strefach pikselowych (1024×600).
    Każda strefa ma twardy budżet wysokości/szerokości, więc nic nie może
    się „ścisnąć" ani zostawić pustki: nie ma tu siatki kart negocjującej
    miejsce przez flex/grid fr.

      52px  bar     — marka, zegar, stan zbiorczy
     478px  mid     — rail 96 | stage 770 | dock 156
      68px  nav     — wielkie cele dotykowe (jedna strona = jeden collector)
  -->
  <div class="panel" id="panel" data-status="ok">

    <header class="bar">
      <img class="bar-mark" src="../assets/oh-emblem.png" alt="Outer Haven">
      <div class="bar-id">
        <span class="bar-id-main">OUTER HAVEN</span>
        <span class="bar-id-sub" id="host-name">MOTHER_BASE</span>
      </div>
      <div class="bar-gap"></div>
      <div class="bar-toast" id="toast" hidden></div>
      <button type="button" class="bar-btn" id="cycle-btn" aria-pressed="false">CYCLE</button>
      <div class="bar-clock">
        <span class="bar-clock-time" id="clock-time">--:--</span>
        <span class="bar-clock-up" id="clock-up">UP —</span>
      </div>
      <div class="bar-state" id="overall" data-status="ok">LINK</div>
    </header>

    <div class="hair" aria-hidden="true"></div>

    <div class="mid">
      <!-- Szyna życia — te same wskaźniki na KAŻDEJ stronie -->
      <aside class="rail" id="rail" aria-label="Vitals"></aside>
      <div class="hair-v" aria-hidden="true"></div>

      <!-- Scena — jedna wielka liczba + sparkline w tle -->
      <section class="stage" id="stage" aria-live="polite"></section>

      <!-- Dok — szczegóły i akcje dotykowe; ukrywa się, gdy nie ma treści -->
      <div class="hair-v" id="dock-hair" aria-hidden="true"></div>
      <aside class="dock" id="dock"></aside>
    </div>

    <div class="hair" aria-hidden="true"></div>

    <nav class="nav" id="nav" role="tablist" aria-label="Pages"></nav>

    <div class="boot" id="boot">
      <div class="boot-word" id="boot-word">CONNECTING</div>
    </div>
  </div>

  <script src="panel.js?v=panel1"></script>
</body>
</html>
