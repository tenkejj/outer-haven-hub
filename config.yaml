# Outer Haven Hub — konfiguracja włączonych źródeł danych.
# Dodanie nowego collectora = dopisanie id poniżej + wpis w registry.py.
# Kolejność na liście = kolejność kart na stronie Start.

enabled_collectors:
  - pihole
  - wireguard
  - system
  - smart
  - services
  # - nextcloud   ← odkomentuj, gdy dodasz ten moduł

collectors:
  pihole:
    # Adres bazowy API Pi-hole (ta sama maszyna → localhost).
    # Hasło aplikacji: backend/.env → PIHOLE_APP_PASSWORD
    # Jeśli Caddy zajmuje 80/443, Pi-hole często jest na :8080 →
    # "http://127.0.0.1:8080" — patrz DEPLOY.md.
    base_url: "http://127.0.0.1"

  smart:
    # Ścieżka urządzenia SSD. Musi być identyczna z wpisem w
    # deploy/sudoers-outer-haven-hub (sudo porównuje argumenty 1:1).
    device: "/dev/sda"
    # Punkt montowania do metryki FREE (shutil.disk_usage).
    mount: "/"

  system:
    # Interfejs do ruchu sieciowego (strona Sieć). eth0 typowe na Pi Ethernet.
    iface: "eth0"

  wireguard:
    # Mapa klucz_publiczny → przyjazna nazwa na karcie.
    # Klucz bierzesz z `sudo wg show` (kolumna peer).
    peer_names:
      # "YOUR_PEER_PUBLIC_KEY_BASE64=": "laptop"
      # "ANOTHER_PEER_PUBLIC_KEY_BASE64=": "phone"

  services:
    # Jednostki systemd — Usługi (wszystkie) / Media (media: true) / Minecraft (game: true).
    # critical: false → wyłączenie nie psuje zbiorczego statusu (np. bluetooth, MC).
    # note = adres / URL do pokazania na karcie (bez sekretów).
    units:
      - id: jellyfin
        unit: jellyfin.service
        label: Filmy
        media: true
        note: "http://mother-base:8096"
      - id: samba
        unit: smbd.service
        label: Udostępnianie plików
        media: true
        note: "smb://mother-base"
      - id: minecraft
        unit: minecraft.service
        label: Minecraft
        game: true
        # Wyłączony serwer to normalne — nie czerwony alert całego huba.
        critical: false
        note: "mother-base:25565"
      - id: nmbd
        unit: nmbd.service
        label: Samba (nazwy)
      - id: winbind
        unit: winbind.service
        label: Winbind
        critical: false
      - id: wsdd2
        unit: wsdd2.service
        label: Wykrywanie w sieci
      - id: caddy
        unit: caddy.service
        label: Strony WWW
      - id: pihole
        unit: pihole-FTL.service
        label: Blokada reklam
      - id: unbound
        unit: unbound.service
        label: DNS lokalny
      - id: hub
        unit: outer-haven-hub.service
        label: Ten hub
      - id: ssh
        unit: ssh.service
        label: SSH
      - id: nm
        unit: NetworkManager.service
        label: Sieć
      - id: avahi
        unit: avahi-daemon.service
        label: Wykrywanie (.local)
        critical: false
      - id: bluetooth
        unit: bluetooth.service
        label: Bluetooth
        critical: false
      - id: cron
        unit: cron.service
        label: Harmonogram
        critical: false
      - id: smart
        unit: smartmontools.service
        label: Monitoring dysku
        critical: false
