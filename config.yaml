# Outer Haven Hub — konfiguracja włączonych źródeł danych.
# Dodanie nowego collectora = dopisanie id poniżej + wpis w registry.py.
# Kolejność na liście = kolejność kart na dashboardzie (HUB).

enabled_collectors:
  - pihole
  - wireguard
  - system
  - smart
  - services
  # - nextcloud   ← odkomentuj, gdy dodasz ten moduł

collectors:
  pihole:
    # Adres bazowy API Pi-hole (ta sama maszyna → localhost).
    # Hasło aplikacji: backend/.env → PIHOLE_APP_PASSWORD
    # Jeśli Caddy zajmuje 80/443, Pi-hole często jest na :8080 →
    # "http://127.0.0.1:8080" — patrz DEPLOY.md.
    base_url: "http://127.0.0.1"

  smart:
    # Ścieżka urządzenia SSD. Musi być identyczna z wpisem w
    # deploy/sudoers-outer-haven-hub (sudo porównuje argumenty 1:1).
    device: "/dev/sda"
    # Punkt montowania do metryki FREE (shutil.disk_usage).
    mount: "/"

  system:
    # Interfejs do NET IN/OUT (strona NET). eth0 typowe na Pi Ethernet.
    iface: "eth0"

  wireguard:
    # Mapa klucz_publiczny → przyjazna nazwa na karcie.
    # Klucz bierzesz z `sudo wg show` (kolumna peer).
    peer_names:
      # "YOUR_PEER_PUBLIC_KEY_BASE64=": "laptop"
      # "ANOTHER_PEER_PUBLIC_KEY_BASE64=": "phone"

  services:
    # Jednostki systemd — strona SVC (wszystkie) / MEDIA (media: true).
    # critical: false → DOWN nie psuje zbiorczego statusu (np. bluetooth).
    # note = tekstowy URL/port (bez sekretów).
    units:
      - id: jellyfin
        unit: jellyfin.service
        label: JELLYFIN
        media: true
        note: "http://mother-base:8096"
      - id: samba
        unit: smbd.service
        label: SMB
        media: true
        note: "smb://mother-base"
      - id: nmbd
        unit: nmbd.service
        label: NMBD
      - id: winbind
        unit: winbind.service
        label: WINBIND
        critical: false
      - id: wsdd2
        unit: wsdd2.service
        label: WSDD2
      - id: caddy
        unit: caddy.service
        label: CADDY
      - id: pihole
        unit: pihole-FTL.service
        label: PIHOLE
      - id: unbound
        unit: unbound.service
        label: UNBOUND
      - id: hub
        unit: outer-haven-hub.service
        label: HUB
      - id: ssh
        unit: ssh.service
        label: SSH
      - id: nm
        unit: NetworkManager.service
        label: NETMGR
      - id: avahi
        unit: avahi-daemon.service
        label: AVAHI
        critical: false
      - id: bluetooth
        unit: bluetooth.service
        label: BT
        critical: false
      - id: cron
        unit: cron.service
        label: CRON
        critical: false
      - id: smart
        unit: smartmontools.service
        label: SMARTD
        critical: false
