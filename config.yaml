# Outer Haven Hub — enabled data sources.
# New collector = id below + entry in registry.py.
# List order = card order on Home.

enabled_collectors:
  - pihole
  - wireguard
  - system
  - smart
  - services
  # - nextcloud

collectors:
  pihole:
    # Pi-hole API base. App password: backend/.env → PIHOLE_APP_PASSWORD
    # If Caddy owns 80/443, Pi-hole is often on :8080 — see DEPLOY.md.
    base_url: "http://127.0.0.1"

  smart:
    # Must match deploy/sudoers-outer-haven-hub (sudo argv 1:1).
    device: "/dev/sda"
    mount: "/"

  system:
    # Interface for NET IN/OUT (Net page). eth0 typical on Pi Ethernet.
    iface: "eth0"

  wireguard:
    peer_names:
      # "YOUR_PEER_PUBLIC_KEY_BASE64=": "laptop"
      # "ANOTHER_PEER_PUBLIC_KEY_BASE64=": "phone"

  services:
    # systemd units — Svc (all) / Media (media: true) / MC (game: true).
    # critical: false → OFF does not trip overall status.
    units:
      - id: jellyfin
        unit: jellyfin.service
        label: Jellyfin
        media: true
        note: "http://mother-base:8096"
      - id: samba
        unit: smbd.service
        label: Files
        media: true
        note: "smb://mother-base"
      - id: minecraft
        unit: minecraft.service
        label: Minecraft
        game: true
        critical: false
        note: "mother-base:25565"
      - id: nmbd
        unit: nmbd.service
        label: NMBD
      - id: winbind
        unit: winbind.service
        label: Winbind
        critical: false
      - id: wsdd2
        unit: wsdd2.service
        label: WSDD
      - id: caddy
        unit: caddy.service
        label: Caddy
      - id: pihole
        unit: pihole-FTL.service
        label: Pi-hole
      - id: unbound
        unit: unbound.service
        label: Unbound
      - id: hub
        unit: outer-haven-hub.service
        label: Hub
      - id: ssh
        unit: ssh.service
        label: SSH
      - id: nm
        unit: NetworkManager.service
        label: Net
      - id: avahi
        unit: avahi-daemon.service
        label: Avahi
        critical: false
      - id: bluetooth
        unit: bluetooth.service
        label: BT
        critical: false
      - id: cron
        unit: cron.service
        label: Cron
        critical: false
      - id: smart
        unit: smartmontools.service
        label: SMART
        critical: false
